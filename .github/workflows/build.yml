name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Remove tracked stale build artifacts
        run: |
          git ls-files -- app/build/ | xargs -r rm -f
          rm -rf app/build/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Inject signing config
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=release.jks" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" | base64 -d > app/release.jks
          else
            keytool -genkeypair -v -keystore app/release.jks \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            sed -i 's/^keyAlias=.*/keyAlias=androiddebugkey/' local.properties
            sed -i 's/^storePassword=.*/storePassword=android/' local.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew


      - name: Build leanback release
        run: ./gradlew assembleLeanbackRelease

      - name: Build mobile release
        run: ./gradlew assembleMobileRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: Release/apk/*.apk
          if-no-files-found: ignore

      - name: Upload leanback APKs
        uses: actions/upload-artifact@v4
        with:
          name: leanback-apk
          path: app/build/outputs/apk/leanback/release/*.apk
          if-no-files-found: ignore

      - name: Upload mobile APKs
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: app/build/outputs/apk/mobile/release/*.apk
          if-no-files-found: ignore